<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayHub — Multi-Tenant Payment Board</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .box { max-width:480px; width:90%; background:var(--card); border-radius:16px; padding:2rem; box-shadow:0 20px 50px rgba(0,0,0,.4); }
    h1 { margin:0 0 .5rem; font-size:1.75rem; }
    p { color:var(--muted); line-height:1.5; }
    a.btn { display:inline-block; margin:0.5rem 0.5rem 0 0; padding:.7rem 1.2rem; background:var(--accent); color:#0f172a; text-decoration:none; border-radius:8px; font-weight:600; }
    a.btn.secondary { background:transparent; border:1px solid var(--accent); color:var(--accent); }
  </style>
</head>
<body>
  <div class="box">
    <h1>PayHub</h1>
    <p>Multi-tenant payment verification. Create an account, add your personal Binance API keys, and connect your Telegram board.</p>
    <a class="btn" href="/dashboard">User Dashboard</a>
    <a class="btn secondary" href="/admin">Admin Panel</a>
    <a class="btn secondary" href="/docs">API Docs</a>
  </div>
</body>
</html>
